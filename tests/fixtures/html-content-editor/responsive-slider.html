<style>
.clinic { --page-gutter: 15px; --grid-gap: clamp(12px, 1.667vw, 40px); }

.clinic-slider__track { display:flex; gap:var(--grid-gap); }

@media (min-width: 1440px) { .clinic-slider__item { flex:0 0 calc((100% - 3 * var(--grid-gap)) / 4); } }
@media (min-width: 1920px) { .clinic { --page-gutter: 90px; } }
@media (min-width: 2560px) { .clinic { --page-gutter: 120px; } }
</style>

</div></div></section>
